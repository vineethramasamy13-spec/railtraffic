name: CI/CD — Rail Traffic Management Platform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ─── Frontend Build & Verification ────────────────────────
  frontend-check:
    name: Frontend — Type-Check & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript check
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Build (production)
        working-directory: apps/web
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000
          NEXT_PUBLIC_AI_SERVICE_URL: http://localhost:8000
          NEXT_PUBLIC_WS_URL: ws://localhost:4000
          NEXT_PUBLIC_DEMO_MODE: 'true'

  # ─── Backend Build & Verification ─────────────────────────
  backend-check:
    name: Backend — Type-Check & Prisma
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install workspace dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma Client
        working-directory: apps/api
        run: npx prisma generate

      - name: TypeScript check
        working-directory: apps/api
        run: npx tsc --noEmit

  # ─── AI Service Syntax Verification ───────────────────────
  ai-service-check:
    name: AI Service — Syntax Verification
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        working-directory: apps/ai-service
        run: pip install -r requirements.txt

      - name: Syntax check
        working-directory: apps/ai-service
        run: python -m compileall app/ main.py
